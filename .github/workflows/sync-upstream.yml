name: Sync Upstream

on:
  schedule:
    - cron: '0 3 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/qwerttvv/Beijing-IPTV.git
          git fetch upstream

      - name: Sync with upstream
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/upstream/master; then
            upstream_branch=upstream/master
          elif git show-ref --verify --quiet refs/remotes/upstream/main; then
            upstream_branch=upstream/main
          else
            echo "::error::Upstream has neither master nor main."
            exit 1
          fi

          if ! git merge "$upstream_branch" --no-edit -m "Sync from upstream"; then
            git merge --abort || true
            echo "::error::Upstream merge failed. Resolve the merge manually."
            exit 1
          fi

      - name: Replace IP addresses
        shell: bash
        run: |
          for file in *.m3u; do
            if [ -f "$file" ]; then
              sed -i 's/192\.168\.123\.1:23234/192.168.1.1:4022/g' "$file"
              git add -- "$file"
            fi
          done

      - name: Commit and push
        shell: bash
        run: |
          if ! git diff --cached --quiet; then
            git commit -m "auto sync: replace IPTV server address"
          fi

          git push origin HEAD:master
