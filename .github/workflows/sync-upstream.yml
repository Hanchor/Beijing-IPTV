name: Sync Upstream

on:
  schedule:
    - cron: '0 3 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/qwerttvv/Beijing-IPTV.git
          git fetch --no-tags upstream master

      - name: Merge upstream history and synchronize files
        shell: bash
        run: |
          set -euo pipefail

          upstream_ref=refs/remotes/upstream/master

          # Prepare a merge that records upstream history.
          # The final file contents are set explicitly below.
          git merge --no-ff --no-commit -s ours "$upstream_ref"

          # Use the complete upstream tree, including file deletions.
          git read-tree --reset -u "$upstream_ref"

          # Preserve this repository's GitHub Actions workflows.
          git restore \
            --source=HEAD \
            --staged \
            --worktree \
            -- .github/workflows

          # Replace the server address in root-level playlists.
          for file in *.m3u; do
            if [ -f "$file" ]; then
              sed -i \
                's/192\.168\.123\.1:23234/192.168.1.1:4022/g' \
                "$file"
              git add -- "$file"
            fi
          done

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          # Commit even when files are unchanged if a merge is pending.
          if git rev-parse --verify -q MERGE_HEAD >/dev/null; then
            git commit -m "Sync upstream and replace IPTV server address"
          elif ! git diff --cached --quiet; then
            git commit -m "Update upstream files and replace IPTV server address"
          else
            echo "Already up to date."
          fi

          # Verify that the fetched upstream history is included.
          git merge-base --is-ancestor upstream/master HEAD

          git push origin HEAD:master
