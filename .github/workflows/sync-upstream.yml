name: Sync Upstream

on:
  schedule:
    - cron: '0 3 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/qwerttvv/Beijing-IPTV.git
          git fetch --no-tags upstream master

      - name: Update playlists and replace address
        shell: bash
        run: |
          set -euo pipefail

          upstream_ref=refs/remotes/upstream/master
          playlists=()

          while IFS= read -r -d '' file; do
            if [[ "$file" != */* && "$file" == *.m3u ]]; then
              playlists+=("$file")
            fi
          done < <(git ls-tree -r --name-only -z "$upstream_ref")

          if (( ${#playlists[@]} == 0 )); then
            echo "::error::No root-level .m3u files found upstream."
            exit 1
          fi

          # Remove existing root-level playlists, including obsolete ones.
          git rm -f --ignore-unmatch -- ':(top,glob)*.m3u'

          # Copy the latest playlists directly from upstream.
          git restore \
            --source="$upstream_ref" \
            --staged \
            --worktree \
            -- "${playlists[@]}"

          # Apply the local server address.
          for file in "${playlists[@]}"; do
            sed -i \
              's/192\.168\.123\.1:23234/192.168.1.1:4022/g' \
              "$file"
            git add -- "$file"
          done

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "Playlists are already up to date."
            exit 0
          fi

          git commit -m "auto sync: update IPTV playlists and replace server address"
          git push origin HEAD:master
